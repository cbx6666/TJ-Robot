name: ros2-ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          retry() {
            local max="${1:-3}"
            local delay="${2:-5}"
            shift 2
            local n=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [[ "${n}" -ge "${max}" ]]; then
                echo "ERROR: command failed after ${max} attempts: $*" >&2
                return 1
              fi
              echo "Retry ${n}/${max} for: $*"
              n=$((n + 1))
              sleep "${delay}"
            done
          }

          echo "=== ROS/rosdep diagnostics ==="
          which rosdep || true
          rosdep --version || true
          python3 --version || true
          uname -a || true

          sudo apt-get update
          # Keep rosdep present even if setup-ros behavior changes.
          sudo apt-get install -y python3-rosdep || true
          # Some fresh runners need rosdep initialization.
          sudo rosdep init || true
          if ! retry 3 5 rosdep update; then
            echo "::warning::rosdep update failed after retries, continue to build for further diagnosis"
          fi
          # Verbose output helps pinpoint unresolved keys in CI logs.
          if ! rosdep install --from-paths ros_ws/src --ignore-src -r -y -v; then
            echo "::warning::rosdep install failed, continue to build/test to expose missing deps explicitly"
          fi

      - name: Build (selected packages)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd ros_ws
          colcon build --event-handlers console_direct+ --packages-up-to robot_bringup human_yolo_seg robot_tasks robot_interfaces robot_interaction robot_manipulation --cmake-args -DROBOT_INTERFACES_ENABLE_ROSIDL=ON

      - name: Test (selected packages)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd ros_ws
          colcon test --event-handlers console_direct+ --packages-select robot_tasks
          colcon test-result --verbose
